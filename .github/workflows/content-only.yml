# Editors may change articles and their media, nothing else.
# pull_request_target runs this file as it stands on main, so a PR cannot edit the guard to pass itself.
# The PR's code is never checked out; only its list of changed files is read.
name: content-only
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  pull-requests: read
jobs:
  content-only:
    runs-on: ubuntu-latest
    steps:
      - name: Only content/articles and content/media
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$AUTHOR" = "apostoloschatzisavvas" ]; then
            echo "Owner: no path limit."; exit 0
          fi
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[] | .filename, (.previous_filename // empty)')
          bad=$(printf '%s\n' "$files" | grep -v -E '^content/(articles|media)/' || true)
          if [ -n "$bad" ]; then
            echo "This pull request changes files outside content/articles and content/media:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "Articles and media only: OK."
