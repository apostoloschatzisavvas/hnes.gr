# Netlify settings for hnes.gr. The site in site/ is rebuilt with the articles into public/.
[build]
  command = "pip install -q -r requirements.txt && python3 build.py"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.mjs"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/ekpe-katastatiko.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/home-x1/"
  to = "/"
  status = 301

[[redirects]]
  from = "/home-x2/"
  to = "/"
  status = 301

[[redirects]]
  from = "/home-x3/"
  to = "/"
  status = 301

[[redirects]]
  from = "/landing/"
  to = "/"
  status = 301

[[redirects]]
  from = "/sample-page/"
  to = "/"
  status = 301

[[redirects]]
  from = "/hello-world/"
  to = "/"
  status = 301

[[redirects]]
  from = "/el/home-x1/"
  to = "/"
  status = 301

[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/comments/feed/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-content/uploads/2026/01/HNES.pdf"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
